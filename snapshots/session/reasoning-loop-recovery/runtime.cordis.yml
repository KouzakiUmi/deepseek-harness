# The scenario does not use an OS shell; exclude its platform-owned tool schemas.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true

- id: repeat-tool-reminder
  config:
    reasoningLoop:
      windowChars: 2048
      scanChars: 16
      holdChars: 160
      confirmChars: 480
      cancelChars: 4096
      recoveryChars: 160
      maxPeriodChars: 128
      minPoolUnits: 12
      poolShare: 0.72
      visibleStall: false
      maxRecoveries: 1

- id: llm-replay
  config:
    providers:
      - id: deepseek-official
        name: DeepSeek
        retryPolicy:
          mode: always
          backoff:
            initialDelayMs: 1
            maxDelayMs: 1
            jitterRatio: 0
        models:
          - id: deepseek-v4-flash
            reasoningReplay: editable-plain
